---
layout: layout.njk
title: "Free Image Compressor & WebP Converter"
---

<main class="max-w-5xl mx-auto px-4 py-12">
    
    <header class="text-center mb-10">
        <h2 class="text-3xl md:text-4xl font-extrabold mb-3 tracking-tight">Bulk Image Compressor & WebP Converter</h2>
        <p class="text-gray-600 max-w-xl mx-auto text-sm">Shrink image file sizes by up to 90% without losing quality. Processed entirely in your browser.</p>
    </header>

    <div id="toolZone" class="bg-white p-6 md:p-8 rounded-2xl shadow-xl border border-gray-100">
        
        <!-- Upload Zone -->
        <div id="uploadZone" class="text-center py-16 border-4 border-dashed border-gray-200 rounded-xl bg-gray-50 cursor-pointer hover:border-blue-400 hover:bg-blue-50 transition-all">
            <input type="file" id="imageInput" accept="image/png, image/jpeg, image/webp" class="hidden">
            <label for="imageInput" class="cursor-pointer">
                <svg class="mx-auto h-16 w-16 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                <p class="mt-4 text-lg font-semibold text-gray-700">Drag & Drop Image or Click to Upload</p>
                <p class="text-sm text-gray-500 mt-1">Supports PNG, JPG, and WEBP files</p>
            </label>
        </div>

        <!-- Editor Zone -->
        <div id="editorZone" class="hidden">
            
            <div class="bg-gray-100 p-4 rounded-xl mb-6 grid sm:grid-cols-2 gap-4 border border-gray-200">
                <div>
                    <label for="formatSelect" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Convert Format:</label>
                    <select id="formatSelect" class="w-full bg-white border border-gray-300 rounded-lg px-3 py-2 text-sm font-medium focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <option value="image/webp" selected>WebP (Best Compression)</option>
                        <option value="image/jpeg">JPEG (Standard Photo)</option>
                        <option value="image/png">PNG (Lossless)</option>
                    </select>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label for="qualitySlider" class="text-xs font-bold text-gray-700 uppercase tracking-wider">Quality Level:</label>
                        <span id="qualityVal" class="text-xs font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded">75%</span>
                    </div>
                    <input type="range" id="qualitySlider" min="10" max="100" value="75" class="w-full accent-blue-600 cursor-pointer mt-1">
                </div>
            </div>

            <div class="grid grid-cols-3 gap-4 mb-6 text-center">
                <div class="bg-gray-50 p-4 rounded-xl border border-gray-200">
                    <span class="block text-xs font-medium text-gray-500 uppercase">Original Size</span>
                    <span id="origSize" class="text-lg font-bold text-gray-800 mt-1 block">-</span>
                </div>
                <div class="bg-blue-50 p-4 rounded-xl border border-blue-100">
                    <span class="block text-xs font-medium text-blue-600 uppercase">New Size</span>
                    <span id="newSize" class="text-lg font-bold text-blue-700 mt-1 block">-</span>
                </div>
                <div class="bg-green-50 p-4 rounded-xl border border-green-100">
                    <span class="block text-xs font-medium text-green-600 uppercase">Space Saved</span>
                    <span id="savedPct" class="text-lg font-bold text-green-700 mt-1 block">-</span>
                </div>
            </div>

            <div class="flex justify-center items-center bg-gray-100 rounded-xl p-4 mb-6 min-h-[250px] border border-gray-200">
                <img id="imagePreview" class="max-h-[400px] w-auto rounded-lg shadow-sm" src="" alt="Compressed Preview">
            </div>

            <div class="text-center flex flex-col items-center gap-3">
                <button id="downloadBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg text-lg shadow-md transition-all flex items-center gap-2">
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                    Download Compressed Image
                </button>
                <button id="resetBtn" class="text-sm text-gray-500 hover:text-blue-600">Compress Another Image</button>
            </div>
        </div>

    </div>

</main>

<script>
    const imageInput = document.getElementById('imageInput');
    const uploadZone = document.getElementById('uploadZone');
    const editorZone = document.getElementById('editorZone');
    const formatSelect = document.getElementById('formatSelect');
    const qualitySlider = document.getElementById('qualitySlider');
    const qualityVal = document.getElementById('qualityVal');
    const origSize = document.getElementById('origSize');
    const newSize = document.getElementById('newSize');
    const savedPct = document.getElementById('savedPct');
    const imagePreview = document.getElementById('imagePreview');
    const downloadBtn = document.getElementById('downloadBtn');
    const resetBtn = document.getElementById('resetBtn');

    let originalFile = null;
    let originalImg = new Image();
    let compressedBlob = null;

    imageInput.addEventListener('change', (e) => {
        if (e.target.files[0]) loadFile(e.target.files[0]);
    });

    uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('border-blue-400', 'bg-blue-50'); });
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('border-blue-400', 'bg-blue-50'));
    uploadZone.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadZone.classList.remove('border-blue-400', 'bg-blue-50');
        if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
    });

    function loadFile(file) {
        originalFile = file;
        origSize.textContent = formatBytes(file.size);

        const reader = new FileReader();
        reader.onload = (e) => {
            originalImg.onload = () => {
                uploadZone.classList.add('hidden');
                editorZone.classList.remove('hidden');
                compressImage();
            };
            originalImg.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    qualitySlider.addEventListener('input', () => {
        qualityVal.textContent = `${qualitySlider.value}%`;
        compressImage();
    });

    formatSelect.addEventListener('change', compressImage);

    function compressImage() {
        if (!originalImg.src) return;

        const canvas = document.createElement('canvas');
        canvas.width = originalImg.width;
        canvas.height = originalImg.height;

        const ctx = canvas.getContext('2d');
        
        if (formatSelect.value === 'image/jpeg') {
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        ctx.drawImage(originalImg, 0, 0);

        const quality = parseInt(qualitySlider.value, 10) / 100;
        const mimeType = formatSelect.value;

        canvas.toBlob((blob) => {
            if (!blob) return;
            compressedBlob = blob;

            newSize.textContent = formatBytes(blob.size);
            
            const diff = originalFile.size - blob.size;
            const pctSaved = Math.round((diff / originalFile.size) * 100);

            if (pctSaved > 0) {
                savedPct.textContent = `-${pctSaved}%`;
                savedPct.className = "text-lg font-bold text-green-700 mt-1 block";
            } else {
                savedPct.textContent = `+${Math.abs(pctSaved)}%`;
                savedPct.className = "text-lg font-bold text-amber-600 mt-1 block";
            }

            imagePreview.src = URL.createObjectURL(blob);
        }, mimeType, quality);
    }

    function formatBytes(bytes) {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    downloadBtn.addEventListener('click', () => {
        if (!compressedBlob) return;
        const extMap = { 'image/webp': 'webp', 'image/jpeg': 'jpg', 'image/png': 'png' };
        const ext = extMap[formatSelect.value] || 'jpg';
        
        const url = URL.createObjectURL(compressedBlob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `compressed_${Date.now()}.${ext}`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    });

    resetBtn.addEventListener('click', () => {
        uploadZone.classList.remove('hidden');
        editorZone.classList.add('hidden');
        imageInput.value = '';
        originalFile = null;
        compressedBlob = null;
    });
</script>
