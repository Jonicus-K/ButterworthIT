---
layout: layout.njk
title: "Free Custom QR Code Generator"
---

<!-- QRCode.js Library CDN -->
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

<main class="max-w-5xl mx-auto px-4 py-8">
    
    <header class="text-center mb-6">
        <h2 class="text-3xl md:text-4xl font-extrabold mb-2 tracking-tight text-gray-900 dark:text-white">Custom QR Code <span class="text-blue-600 dark:text-blue-400">Generator</span></h2>
        <p class="text-gray-600 dark:text-gray-300 max-w-xl mx-auto text-sm">Generate customizable QR codes for links, Wi-Fi networks, and contact details with zero tracking.</p>
    </header>

    <div class="bg-white dark:bg-gray-800 p-6 md:p-8 rounded-2xl shadow-xl border border-gray-100 dark:border-gray-700 transition-colors">
        
        <div class="grid md:grid-cols-12 gap-8">
            
            <!-- Left Column: Input Settings -->
            <div class="md:col-span-7 space-y-6">
                
                <!-- Data Type Selection Tabs -->
                <div>
                    <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 uppercase tracking-wider mb-2">QR Code Type</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button type="button" data-type="url" class="type-btn bg-blue-600 text-white font-bold py-2 px-3 rounded-lg text-xs shadow-sm transition-all text-center">🔗 Link / URL</button>
                        <button type="button" data-type="text" class="type-btn bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 hover:bg-gray-200 dark:hover:bg-gray-600 font-bold py-2 px-3 rounded-lg text-xs transition-all text-center">📝 Plain Text</button>
                        <button type="button" data-type="wifi" class="type-btn bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 hover:bg-gray-200 dark:hover:bg-gray-600 font-bold py-2 px-3 rounded-lg text-xs transition-all text-center">📶 Wi-Fi Login</button>
                    </div>
                </div>

                <!-- Input Fields: URL Mode -->
                <div id="fieldUrl" class="type-field">
                    <label for="urlInput" class="block text-xs font-bold text-gray-700 dark:text-gray-300 uppercase tracking-wider mb-1">Target Website URL</label>
                    <input type="url" id="urlInput" value="https://bwtools.uk" placeholder="https://example.com" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 text-gray-900 dark:text-white rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <!-- Input Fields: Plain Text Mode -->
                <div id="fieldText" class="type-field hidden">
                    <label for="textInput" class="block text-xs font-bold text-gray-700 dark:text-gray-300 uppercase tracking-wider mb-1">Text Content</label>
                    <textarea id="textInput" rows="3" placeholder="Enter notes, serial numbers, or message..." class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 text-gray-900 dark:text-white rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
                </div>

                <!-- Input Fields: Wi-Fi Mode -->
                <div id="fieldWifi" class="type-field hidden space-y-3">
                    <div>
                        <label for="wifiSsid" class="block text-xs font-bold text-gray-700 dark:text-gray-300 uppercase tracking-wider mb-1">Network Name (SSID)</label>
                        <input type="text" id="wifiSsid" placeholder="e.g. Home_WiFi" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 text-gray-900 dark:text-white rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label for="wifiPass" class="block text-xs font-bold text-gray-700 dark:text-gray-300 uppercase tracking-wider mb-1">Password</label>
                        <input type="text" id="wifiPass" placeholder="Network password" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 text-gray-900 dark:text-white rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label for="wifiAuth" class="block text-xs font-bold text-gray-700 dark:text-gray-300 uppercase tracking-wider mb-1">Encryption</label>
                        <select id="wifiAuth" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 text-gray-900 dark:text-white rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="WPA">WPA / WPA2 / WPA3</option>
                            <option value="WEP">WEP</option>
                            <option value="nopass">No Password (Open)</option>
                        </select>
                    </div>
                </div>

                <!-- Styling Options -->
                <div class="bg-gray-50 dark:bg-gray-900/60 p-4 rounded-xl border border-gray-200 dark:border-gray-700 space-y-4">
                    <h3 class="text-xs font-bold text-gray-700 dark:text-gray-300 uppercase tracking-wider">Customise Appearance</h3>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label for="fgColor" class="block text-xs text-gray-500 dark:text-gray-400 mb-1 font-semibold">QR Color</label>
                            <div class="flex items-center bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-lg px-2 py-1 gap-2">
                                <input type="color" id="fgColor" value="#000000" class="w-6 h-6 rounded cursor-pointer border-0 p-0 bg-transparent">
                                <span id="fgColorVal" class="text-xs font-mono text-gray-700 dark:text-gray-300">#000000</span>
                            </div>
                        </div>

                        <div>
                            <label for="bgColor" class="block text-xs text-gray-500 dark:text-gray-400 mb-1 font-semibold">Background</label>
                            <div class="flex items-center bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-lg px-2 py-1 gap-2">
                                <input type="color" id="bgColor" value="#ffffff" class="w-6 h-6 rounded cursor-pointer border-0 p-0 bg-transparent">
                                <span id="bgColorVal" class="text-xs font-mono text-gray-700 dark:text-gray-300">#ffffff</span>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label for="eccLevel" class="block text-xs text-gray-500 dark:text-gray-400 mb-1 font-semibold">Error Correction</label>
                            <select id="eccLevel" class="w-full bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 text-gray-900 dark:text-white rounded-lg px-2.5 py-1.5 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
                                <option value="L">Low (~7%)</option>
                                <option value="M" selected>Medium (~15%)</option>
                                <option value="Q">Quartile (~25%)</option>
                                <option value="H">High (~30%)</option>
                            </select>
                        </div>

                        <div>
                            <label for="exportSize" class="block text-xs text-gray-500 dark:text-gray-400 mb-1 font-semibold">Resolution</label>
                            <select id="exportSize" class="w-full bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 text-gray-900 dark:text-white rounded-lg px-2.5 py-1.5 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
                                <option value="512">Standard (512 x 512)</option>
                                <option value="1024" selected>High Res (1024 x 1024)</option>
                                <option value="2048">Ultra Print (2048 x 2048)</option>
                            </select>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Right Column: Live QR Preview & Actions -->
            <div class="md:col-span-5 flex flex-col items-center justify-between border-t md:border-t-0 md:border-l border-gray-200 dark:border-gray-700 pt-6 md:pt-0 md:pl-8">
                
                <div class="flex flex-col items-center">
                    <span class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-4">Live Preview</span>
                    
                    <div class="p-4 bg-white rounded-2xl shadow-md border border-gray-200 flex items-center justify-center">
                        <canvas id="qrCanvas" class="max-w-full h-auto rounded"></canvas>
                    </div>
                    <p class="text-xs text-gray-400 dark:text-gray-500 mt-3 text-center">Point your phone camera to test instant scanning</p>
                </div>

                <!-- Export Buttons -->
                <div class="w-full space-y-2.5 mt-6">
                    <button id="downloadPngBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-4 rounded-lg shadow-sm transition-all text-sm flex items-center justify-center gap-2">
                        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                        Download PNG Image
                    </button>
                    
                    <button id="downloadSvgBtn" class="w-full bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-800 dark:text-gray-200 font-bold py-2 px-4 rounded-lg transition-all text-xs flex items-center justify-center gap-1.5">
                        Download Vector (.SVG)
                    </button>
                </div>

            </div>

        </div>

    </div>

</main>

<script>
    const qrCanvas = document.getElementById('qrCanvas');
    const typeBtns = document.querySelectorAll('.type-btn');
    const fieldUrl = document.getElementById('fieldUrl');
    const fieldText = document.getElementById('fieldText');
    const fieldWifi = document.getElementById('fieldWifi');

    const urlInput = document.getElementById('urlInput');
    const textInput = document.getElementById('textInput');
    const wifiSsid = document.getElementById('wifiSsid');
    const wifiPass = document.getElementById('wifiPass');
    const wifiAuth = document.getElementById('wifiAuth');

    const fgColor = document.getElementById('fgColor');
    const bgColor = document.getElementById('bgColor');
    const fgColorVal = document.getElementById('fgColorVal');
    const bgColorVal = document.getElementById('bgColorVal');
    const eccLevel = document.getElementById('eccLevel');
    const exportSize = document.getElementById('exportSize');

    const downloadPngBtn = document.getElementById('downloadPngBtn');
    const downloadSvgBtn = document.getElementById('downloadSvgBtn');

    let currentType = 'url';

    // Switch Input Modes
    typeBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            typeBtns.forEach(b => {
                b.className = "type-btn bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 hover:bg-gray-200 dark:hover:bg-gray-600 font-bold py-2 px-3 rounded-lg text-xs transition-all text-center";
            });
            btn.className = "type-btn bg-blue-600 text-white font-bold py-2 px-3 rounded-lg text-xs shadow-sm transition-all text-center";
            
            currentType = btn.getAttribute('data-type');
            fieldUrl.classList.add('hidden');
            fieldText.classList.add('hidden');
            fieldWifi.classList.add('hidden');

            if (currentType === 'url') fieldUrl.classList.remove('hidden');
            if (currentType === 'text') fieldText.classList.remove('hidden');
            if (currentType === 'wifi') fieldWifi.classList.remove('hidden');

            generateQRCode();
        });
    });

    // Color Pickers
    fgColor.addEventListener('input', () => {
        fgColorVal.textContent = fgColor.value;
        generateQRCode();
    });

    bgColor.addEventListener('input', () => {
        bgColorVal.textContent = bgColor.value;
        generateQRCode();
    });

    eccLevel.addEventListener('change', generateQRCode);
    urlInput.addEventListener('input', generateQRCode);
    textInput.addEventListener('input', generateQRCode);
    wifiSsid.addEventListener('input', generateQRCode);
    wifiPass.addEventListener('input', generateQRCode);
    wifiAuth.addEventListener('change', generateQRCode);

    function getFormattedPayload() {
        if (currentType === 'url') {
            return urlInput.value.trim() || 'https://bwtools.uk';
        } else if (currentType === 'text') {
            return textInput.value.trim() || 'BWTools.uk';
        } else if (currentType === 'wifi') {
            const ssid = wifiSsid.value.trim() || 'WiFi_Network';
            const pass = wifiPass.value;
            const auth = wifiAuth.value;
            return `WIFI:T:${auth};S:${ssid};P:${pass};;`;
        }
        return 'https://bwtools.uk';
    }

    function generateQRCode() {
        const text = getFormattedPayload();
        
        QRCode.toCanvas(qrCanvas, text, {
            width: 240,
            margin: 2,
            color: {
                dark: fgColor.value,
                light: bgColor.value
            },
            errorCorrectionLevel: eccLevel.value
        }, (err) => {
            if (err) console.error(err);
        });
    }

    // High Resolution PNG Download
    downloadPngBtn.addEventListener('click', () => {
        const text = getFormattedPayload();
        const exportCanvas = document.createElement('canvas');
        const size = parseInt(exportSize.value, 10);

        QRCode.toCanvas(exportCanvas, text, {
            width: size,
            margin: 2,
            color: {
                dark: fgColor.value,
                light: bgColor.value
            },
            errorCorrectionLevel: eccLevel.value
        }, (err) => {
            if (err) {
                alert("Could not export QR code.");
                return;
            }
            exportCanvas.toBlob((blob) => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `qrcode_${Date.now()}.png`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            });
        });
    });

    // Vector SVG Download
    downloadSvgBtn.addEventListener('click', () => {
        const text = getFormattedPayload();
        QRCode.toString(text, {
            type: 'svg',
            margin: 2,
            color: {
                dark: fgColor.value,
                light: bgColor.value
            },
            errorCorrectionLevel: eccLevel.value
        }, (err, svgString) => {
            if (err) {
                alert("Could not export SVG.");
                return;
            }
            const blob = new Blob([svgString], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `qrcode_${Date.now()}.svg`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
    });

    // Initial render
    generateQRCode();
</script>
