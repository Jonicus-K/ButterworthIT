---
layout: layout.njk
title: "Free AI Background Remover"
---

<!-- ES Module Loader for imgly -->
<script type="module">
    import { removeBackground } from "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm";
    window.imglyRemoveBackground = removeBackground;
</script>

<!-- Custom Floating Brush Cursor -->
<div id="brushCursor" class="pointer-events-none fixed rounded-full border-2 border-blue-500 bg-blue-500/20 transform -translate-x-1/2 -translate-y-1/2 hidden z-50"></div>

<main class="max-w-6xl mx-auto px-4 py-8">
    
    <header class="text-center mb-8">
        <h2 class="text-3xl md:text-4xl font-extrabold mb-2 tracking-tight">Remove Backgrounds <span class="text-blue-600">Perfectly</span>.</h2>
        <p class="text-gray-600 max-w-xl mx-auto text-sm">Precision brush tools, custom zoom, and edge ghosting removal.</p>
    </header>

    <div id="toolZone" class="bg-white p-6 rounded-2xl shadow-xl border border-gray-100">
        
        <!-- Upload Zone -->
        <div id="uploadZone" class="text-center py-20 border-4 border-dashed border-gray-200 rounded-xl bg-gray-50 cursor-pointer hover:border-blue-400 hover:bg-blue-50 transition-all">
            <input type="file" id="imageInput" accept="image/*" class="hidden">
            <label for="imageInput" class="cursor-pointer">
                <svg class="mx-auto h-16 w-16 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                <p class="mt-4 text-lg font-semibold text-gray-700">Drag & Drop Image or Click to Upload</p>
                <p class="text-sm text-gray-500 mt-1">Supports PNG, JPG, WEBP</p>
            </label>
        </div>

        <!-- Processing Zone -->
        <div id="processingZone" class="hidden text-center py-20">
            <div class="flex flex-col items-center gap-4">
                <div class="loading-spinner"></div>
                <p id="statusMessage" class="text-lg font-medium text-gray-700">Loading AI Engine...</p>
                <p class="text-sm text-gray-500">Running high-precision AI segmentation...</p>
            </div>
        </div>

        <!-- Result & Studio Editor Zone -->
        <div id="resultZone" class="hidden">
            
            <div class="bg-gray-100 p-3 rounded-xl mb-4 flex flex-wrap items-center justify-between gap-3 border border-gray-200 text-sm">
                
                <!-- Brush Tools -->
                <div class="flex items-center gap-2">
                    <span class="font-semibold text-gray-700 text-xs uppercase tracking-wider">Mode:</span>
                    <button id="modeErase" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg font-medium shadow-sm transition-all flex items-center gap-1">
                        🧹 Erase
                    </button>
                    <button id="modeRestore" class="bg-white text-gray-700 hover:bg-gray-50 border border-gray-300 px-3 py-1.5 rounded-lg font-medium transition-all flex items-center gap-1">
                        🖌️ Restore
                    </button>
                </div>

                <!-- Brush Size Slider -->
                <div class="flex items-center gap-2">
                    <label for="brushSize" class="font-semibold text-gray-700 text-xs uppercase tracking-wider">Size:</label>
                    <input type="range" id="brushSize" min="5" max="150" value="35" class="w-24 accent-blue-600 cursor-pointer">
                    <span id="brushSizeVal" class="text-xs text-gray-600 font-mono w-8">35px</span>
                </div>

                <!-- Ghost Pixel Cleaner -->
                <div class="flex items-center gap-2 border-l border-r border-gray-300 px-3">
                    <button id="cleanGhostsBtn" title="Deletes faint semi-transparent background pixels" class="bg-amber-500 hover:bg-amber-600 text-white px-3 py-1.5 rounded-lg font-medium transition-all flex items-center gap-1">
                        ⚡ Clean Ghost Pixels
                    </button>
                </div>

                <!-- Zoom Controls -->
                <div class="flex items-center gap-1">
                    <span class="font-semibold text-gray-700 text-xs uppercase tracking-wider mr-1">Zoom:</span>
                    <button id="zoomOut" class="bg-white border border-gray-300 hover:bg-gray-50 px-2.5 py-1 rounded text-xs font-bold shadow-sm">-</button>
                    <span id="zoomVal" class="text-xs font-mono w-12 text-center font-bold">100%</span>
                    <button id="zoomIn" class="bg-white border border-gray-300 hover:bg-gray-50 px-2.5 py-1 rounded text-xs font-bold shadow-sm">+</button>
                    <button id="zoomReset" class="bg-white border border-gray-300 hover:bg-gray-50 px-2 py-1 rounded text-xs text-gray-500 shadow-sm ml-1">Reset</button>
                </div>
            </div>

            <!-- Viewport -->
            <div id="viewport" class="relative overflow-auto max-h-[550px] checkerboard rounded-xl p-4 border border-gray-200 text-center">
                <canvas id="editCanvas" class="inline-block shadow-lg rounded-lg cursor-none align-top"></canvas>
            </div>

            <div class="text-center flex flex-col items-center gap-3 mt-6">
                <button id="downloadBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg text-lg shadow-md transition-all flex items-center gap-2">
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                    Download Clean HD PNG
                </button>
                <button id="resetBtn" class="text-sm text-gray-500 hover:text-blue-600">Upload Another Image</button>
            </div>
        </div>
    </div>

</main>

<script>
    const imageInput = document.getElementById('imageInput');
    const uploadZone = document.getElementById('uploadZone');
    const processingZone = document.getElementById('processingZone');
    const resultZone = document.getElementById('resultZone');
    const statusMessage = document.getElementById('statusMessage');
    const editCanvas = document.getElementById('editCanvas');
    const viewport = document.getElementById('viewport');
    const brushCursor = document.getElementById('brushCursor');
    const ctx = editCanvas.getContext('2d');
    
    const modeErase = document.getElementById('modeErase');
    const modeRestore = document.getElementById('modeRestore');
    const brushSize = document.getElementById('brushSize');
    const brushSizeVal = document.getElementById('brushSizeVal');
    const cleanGhostsBtn = document.getElementById('cleanGhostsBtn');
    const zoomIn = document.getElementById('zoomIn');
    const zoomOut = document.getElementById('zoomOut');
    const zoomReset = document.getElementById('zoomReset');
    const zoomVal = document.getElementById('zoomVal');
    const downloadBtn = document.getElementById('downloadBtn');
    const resetBtn = document.getElementById('resetBtn');

    let isDrawing = false;
    let activeTool = 'erase';
    let zoomLevel = 1.0;
    let baseDisplayWidth = 0;
    let baseDisplayHeight = 0;
    let originalImg = new Image();
    let aiResultImg = new Image();

    imageInput.addEventListener('change', (e) => {
        if (e.target.files[0]) processImage(e.target.files[0]);
    });

    async function processImage(file) {
        uploadZone.classList.add('hidden');
        processingZone.classList.remove('hidden');
        resultZone.classList.add('hidden');

        const fileUrl = URL.createObjectURL(file);
        originalImg.src = fileUrl;

        try {
            statusMessage.textContent = "Running AI Segmentation...";

            const rawBlob = await window.imglyRemoveBackground(file, {
                model: 'isnet',
                progress: (key, current, total) => {
                    if (total > 0) {
                        statusMessage.textContent = `Processing image... ${Math.round((current / total) * 100)}%`;
                    }
                }
            });

            aiResultImg.src = URL.createObjectURL(rawBlob);
            aiResultImg.onload = () => {
                editCanvas.width = aiResultImg.width;
                editCanvas.height = aiResultImg.height;
                
                ctx.drawImage(aiResultImg, 0, 0);

                cleanGhostPixels(100);

                processingZone.classList.add('hidden');
                resultZone.classList.remove('hidden');

                const maxAllowedWidth = Math.max(300, viewport.clientWidth - 48);
                const aspect = editCanvas.height / editCanvas.width;
                baseDisplayWidth = Math.min(maxAllowedWidth, editCanvas.width);
                baseDisplayHeight = baseDisplayWidth * aspect;

                zoomLevel = 1.0;
                applyZoom();
            };

        } catch (error) {
            console.error(error);
            alert("Error processing image. Please try again.");
            resetUI();
        }
    }

    editCanvas.addEventListener('mouseenter', () => brushCursor.classList.remove('hidden'));
    editCanvas.addEventListener('mouseleave', () => brushCursor.classList.add('hidden'));

    window.addEventListener('mousemove', (e) => {
        brushCursor.style.left = `${e.clientX}px`;
        brushCursor.style.top = `${e.clientY}px`;
        updateCursorSize();
    });

    function updateCursorSize() {
        const rect = editCanvas.getBoundingClientRect();
        const canvasToDisplayScale = rect.width / editCanvas.width;
        const sizeInPixels = parseInt(brushSize.value, 10) * 2 * canvasToDisplayScale;
        brushCursor.style.width = `${sizeInPixels}px`;
        brushCursor.style.height = `${sizeInPixels}px`;
    }

    zoomIn.addEventListener('click', () => setZoom(zoomLevel + 0.25));
    zoomOut.addEventListener('click', () => setZoom(zoomLevel - 0.25));
    zoomReset.addEventListener('click', () => setZoom(1.0));

    viewport.addEventListener('wheel', (e) => {
        if (e.ctrlKey || e.metaKey) {
            e.preventDefault();
            if (e.deltaY < 0) setZoom(zoomLevel + 0.15);
            else setZoom(zoomLevel - 0.15);
        }
    }, { passive: false });

    function setZoom(newZoom) {
        zoomLevel = Math.max(0.25, Math.min(3.0, newZoom));
        applyZoom();
    }

    function applyZoom() {
        zoomVal.textContent = `${Math.round(zoomLevel * 100)}%`;
        const displayWidth = baseDisplayWidth * zoomLevel;
        const displayHeight = baseDisplayHeight * zoomLevel;
        
        editCanvas.style.width = `${displayWidth}px`;
        editCanvas.style.height = `${displayHeight}px`;
        updateCursorSize();
    }

    cleanGhostsBtn.addEventListener('click', () => cleanGhostPixels(140));

    function cleanGhostPixels(alphaThreshold) {
        const imgData = ctx.getImageData(0, 0, editCanvas.width, editCanvas.height);
        const d = imgData.data;

        for (let i = 0; i < d.length; i += 4) {
            const alpha = d[i + 3];
            if (alpha > 0 && alpha < alphaThreshold) {
                d[i + 3] = 0;
            }
        }

        ctx.putImageData(imgData, 0, 0);
    }

    modeErase.addEventListener('click', () => {
        activeTool = 'erase';
        modeErase.className = "bg-blue-600 text-white px-3 py-1.5 rounded-lg font-medium shadow-sm transition-all";
        modeRestore.className = "bg-white text-gray-700 hover:bg-gray-50 border border-gray-300 px-3 py-1.5 rounded-lg font-medium transition-all";
        brushCursor.className = "pointer-events-none fixed rounded-full border-2 border-blue-500 bg-blue-500/20 transform -translate-x-1/2 -translate-y-1/2 z-50";
    });

    modeRestore.addEventListener('click', () => {
        activeTool = 'restore';
        modeRestore.className = "bg-blue-600 text-white px-3 py-1.5 rounded-lg font-medium shadow-sm transition-all";
        modeErase.className = "bg-white text-gray-700 hover:bg-gray-50 border border-gray-300 px-3 py-1.5 rounded-lg font-medium transition-all";
        brushCursor.className = "pointer-events-none fixed rounded-full border-2 border-green-500 bg-green-500/20 transform -translate-x-1/2 -translate-y-1/2 z-50";
    });

    brushSize.addEventListener('input', () => {
        brushSizeVal.textContent = `${brushSize.value}px`;
        updateCursorSize();
    });

    function getCanvasCoordinates(e) {
        const rect = editCanvas.getBoundingClientRect();
        const scaleX = editCanvas.width / rect.width;
        const scaleY = editCanvas.height / rect.height;
        return {
            x: (e.clientX - rect.left) * scaleX,
            y: (e.clientY - rect.top) * scaleY
        };
    }

    editCanvas.addEventListener('mousedown', (e) => { isDrawing = true; paint(e); });
    editCanvas.addEventListener('mousemove', (e) => { if (isDrawing) paint(e); });
    window.addEventListener('mouseup', () => isDrawing = false);

    function paint(e) {
        const pos = getCanvasCoordinates(e);
        const radius = parseInt(brushSize.value, 10);

        ctx.save();
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, radius, 0, Math.PI * 2);

        if (activeTool === 'erase') {
            ctx.globalCompositeOperation = 'destination-out';
            ctx.fill();
        } else if (activeTool === 'restore') {
            ctx.globalCompositeOperation = 'source-over';
            ctx.clip();
            ctx.drawImage(originalImg, 0, 0);
        }
        ctx.restore();
    }

    downloadBtn.addEventListener('click', () => {
        editCanvas.toBlob((blob) => {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `freebg_clean_${Date.now()}.png`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }, 'image/png');
    });

    resetBtn.addEventListener('click', resetUI);
    function resetUI() {
        uploadZone.classList.remove('hidden');
        processingZone.classList.add('hidden');
        resultZone.classList.add('hidden');
        imageInput.value = '';
    }
</script>
