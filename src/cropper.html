---
layout: layout.njk
title: "Marketplace & Social Image Cropper"
---

<!-- Cropper.js CDN Links -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>

<style>
    .img-container {
        max-height: 500px;
        background-image: conic-gradient(#eee 90deg, #fff 90deg 180deg, #eee 180deg 270deg, #fff 270deg);
        background-size: 20px 20px;
    }
    .img-container img {
        max-height: 500px;
        display: block;
        max-width: 100%;
    }
</style>

<main class="max-w-5xl mx-auto px-4 py-12">
    
    <header class="text-center mb-10">
        <h2 class="text-3xl md:text-4xl font-extrabold mb-3 tracking-tight">Marketplace & Social Image Cropper</h2>
        <p class="text-gray-600 max-w-xl mx-auto text-sm">Crop, frame, and rotate images for eBay, Etsy, Instagram, and web.</p>
    </header>

    <div id="toolZone" class="bg-white p-6 md:p-8 rounded-2xl shadow-xl border border-gray-100">
        
        <!-- Upload Zone -->
        <div id="uploadZone" class="text-center py-16 border-4 border-dashed border-gray-200 rounded-xl bg-gray-50 cursor-pointer hover:border-blue-400 hover:bg-blue-50 transition-all">
            <input type="file" id="imageInput" accept="image/*" class="hidden">
            <label for="imageInput" class="cursor-pointer">
                <svg class="mx-auto h-16 w-16 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                <p class="mt-4 text-lg font-semibold text-gray-700">Drag & Drop Image or Click to Upload</p>
                <p class="text-sm text-gray-500 mt-1">Supports PNG, JPG, WEBP, and GIF</p>
            </label>
        </div>

        <!-- Editor Zone -->
        <div id="editorZone" class="hidden">
            
            <div class="bg-gray-100 p-3 rounded-xl mb-4 flex flex-wrap items-center justify-between gap-3 border border-gray-200 text-sm">
                <div class="flex items-center gap-2 flex-wrap">
                    <span class="font-semibold text-gray-700 text-xs uppercase tracking-wider mr-1">Aspect Ratio:</span>
                    <button data-ratio="free" class="ratio-btn bg-blue-600 text-white px-3 py-1.5 rounded-lg font-medium shadow-sm transition-all text-xs">Freeform</button>
                    <button data-ratio="1" class="ratio-btn bg-white text-gray-700 hover:bg-gray-50 border border-gray-300 px-3 py-1.5 rounded-lg font-medium transition-all text-xs">1:1 (eBay/Square)</button>
                    <button data-ratio="3" class="ratio-btn bg-white text-gray-700 hover:bg-gray-50 border border-gray-300 px-3 py-1.5 rounded-lg font-medium transition-all text-xs">3:1 (Etsy Banner)</button>
                    <button data-ratio="0.5625" class="ratio-btn bg-white text-gray-700 hover:bg-gray-50 border border-gray-300 px-3 py-1.5 rounded-lg font-medium transition-all text-xs">9:16 (Story)</button>
                    <button data-ratio="1.7777" class="ratio-btn bg-white text-gray-700 hover:bg-gray-50 border border-gray-300 px-3 py-1.5 rounded-lg font-medium transition-all text-xs">16:9 (Landscape)</button>
                </div>

                <div class="flex items-center gap-1 border-l border-gray-300 pl-3">
                    <button id="rotateLeft" title="Rotate Left 90°" class="bg-white border border-gray-300 hover:bg-gray-50 p-1.5 rounded-lg text-xs font-bold shadow-sm">↺ 90°</button>
                    <button id="rotateRight" title="Rotate Right 90°" class="bg-white border border-gray-300 hover:bg-gray-50 p-1.5 rounded-lg text-xs font-bold shadow-sm">↻ 90°</button>
                    <button id="flipH" title="Flip Horizontal" class="bg-white border border-gray-300 hover:bg-gray-50 p-1.5 rounded-lg text-xs font-bold shadow-sm">↔ Flip</button>
                    <button id="flipV" title="Flip Vertical" class="bg-white border border-gray-300 hover:bg-gray-50 p-1.5 rounded-lg text-xs font-bold shadow-sm">↕ Flip</button>
                </div>
            </div>

            <div class="img-container rounded-xl border border-gray-200 overflow-hidden flex justify-center items-center mb-6">
                <img id="cropperTarget" src="" alt="Image to crop">
            </div>

            <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 mb-6 grid sm:grid-cols-2 gap-4">
                <div>
                    <label for="exportFormat" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Export Format:</label>
                    <select id="exportFormat" class="w-full bg-white border border-gray-300 rounded-lg px-3 py-2 text-sm font-medium focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <option value="image/png" selected>PNG (Lossless / Transparent)</option>
                        <option value="image/jpeg">JPEG (Standard Photo)</option>
                        <option value="image/webp">WebP (Optimised Web)</option>
                    </select>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label for="exportQuality" class="text-xs font-bold text-gray-700 uppercase tracking-wider">Quality:</label>
                        <span id="qualityVal" class="text-xs font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded">90%</span>
                    </div>
                    <input type="range" id="exportQuality" min="10" max="100" value="90" class="w-full accent-blue-600 cursor-pointer mt-1">
                </div>
            </div>

            <div class="text-center flex flex-col items-center gap-3">
                <button id="downloadBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg text-lg shadow-md transition-all flex items-center gap-2">
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                    Download Cropped Image
                </button>
                <button id="resetBtn" class="text-sm text-gray-500 hover:text-blue-600">Crop Another Image</button>
            </div>
        </div>

    </div>

</main>

<script>
    const imageInput = document.getElementById('imageInput');
    const uploadZone = document.getElementById('uploadZone');
    const editorZone = document.getElementById('editorZone');
    const cropperTarget = document.getElementById('cropperTarget');
    const ratioBtns = document.querySelectorAll('.ratio-btn');
    const rotateLeft = document.getElementById('rotateLeft');
    const rotateRight = document.getElementById('rotateRight');
    const flipH = document.getElementById('flipH');
    const flipV = document.getElementById('flipV');
    const exportFormat = document.getElementById('exportFormat');
    const exportQuality = document.getElementById('exportQuality');
    const qualityVal = document.getElementById('qualityVal');
    const downloadBtn = document.getElementById('downloadBtn');
    const resetBtn = document.getElementById('resetBtn');

    let cropper = null;
    let scaleX = 1;
    let scaleY = 1;

    imageInput.addEventListener('change', (e) => {
        if (e.target.files[0]) loadFile(e.target.files[0]);
    });

    uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('border-blue-400', 'bg-blue-50'); });
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('border-blue-400', 'bg-blue-50'));
    uploadZone.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadZone.classList.remove('border-blue-400', 'bg-blue-50');
        if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
    });

    function loadFile(file) {
        const url = URL.createObjectURL(file);
        cropperTarget.src = url;

        uploadZone.classList.add('hidden');
        editorZone.classList.remove('hidden');

        if (cropper) cropper.destroy();

        cropper = new Cropper(cropperTarget, {
            aspectRatio: NaN,
            viewMode: 1,
            autoCropArea: 0.9,
            responsive: true,
            background: true
        });
    }

    ratioBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            ratioBtns.forEach(b => {
                b.className = "ratio-btn bg-white text-gray-700 hover:bg-gray-50 border border-gray-300 px-3 py-1.5 rounded-lg font-medium transition-all text-xs";
            });
            btn.className = "ratio-btn bg-blue-600 text-white px-3 py-1.5 rounded-lg font-medium shadow-sm transition-all text-xs";

            const ratioVal = btn.getAttribute('data-ratio');
            if (ratioVal === 'free') {
                cropper.setAspectRatio(NaN);
            } else {
                cropper.setAspectRatio(parseFloat(ratioVal));
            }
        });
    });

    rotateLeft.addEventListener('click', () => cropper.rotate(-90));
    rotateRight.addEventListener('click', () => cropper.rotate(90));
    
    flipH.addEventListener('click', () => {
        scaleX = -scaleX;
        cropper.scaleX(scaleX);
    });

    flipV.addEventListener('click', () => {
        scaleY = -scaleY;
        cropper.scaleY(scaleY);
    });

    exportQuality.addEventListener('input', () => {
        qualityVal.textContent = `${exportQuality.value}%`;
    });

    downloadBtn.addEventListener('click', () => {
        if (!cropper) return;

        const format = exportFormat.value;
        const quality = parseInt(exportQuality.value, 10) / 100;

        const canvas = cropper.getCroppedCanvas({
            imageSmoothingEnabled: true,
            imageSmoothingQuality: 'high',
        });

        if (!canvas) return;

        canvas.toBlob((blob) => {
            if (!blob) return;
            const extMap = { 'image/webp': 'webp', 'image/jpeg': 'jpg', 'image/png': 'png' };
            const ext = extMap[format] || 'png';

            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `cropped_${Date.now()}.${ext}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }, format, quality);
    });

    resetBtn.addEventListener('click', () => {
        if (cropper) cropper.destroy();
        cropper = null;
        scaleX = 1;
        scaleY = 1;
        uploadZone.classList.remove('hidden');
        editorZone.classList.add('hidden');
        imageInput.value = '';
    });
</script>
